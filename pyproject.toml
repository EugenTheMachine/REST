[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-spheroid-tracker"
version = "0.1.0"
description = "Resource-efficient spheroid tracker for brightfield microscopy image sequences"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "REST Project Team" }
]
license = { text = "MIT" }
keywords = [
  "biomedical-imaging",
  "microscopy",
  "spheroids",
  "tracking",
  "segmentation",
  "yolo",
  "cryobiology"
]

dependencies = [
  "ultralytics==8.4.126",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "matplotlib==3.9.4",
  "scikit-image==0.25.2",
  "tifffile==2025.3.30",
  "jupyter==1.1.1"
]

[tool.setuptools]
py-modules = ["tracker"]
